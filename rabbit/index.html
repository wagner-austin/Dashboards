<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024, viewport-fit=cover, user-scalable=no">
    <title>Bunny Scroller</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            min-height: 100vh;
            overflow: hidden;
        }

        #screen {
            font-family: "Courier New", monospace;
            /* Character size sets the WHOLE scene's scale — trees, rabbit and
               glyphs alike — because Viewport.ts derives the grid as
               floor(viewportHeight / charH). Raise it and everything grows;
               it is not the knob for how far up the trees reach. Use the
               iframe's height for that. */
            font-size: 10px;
            line-height: 1.0;
            white-space: pre;
            color: #e0e0e0;
            position: absolute;
            bottom: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <pre id="screen"></pre>
    <script type="module" src="./bundle/app.4f93ab3d.js"></script>
</body>
</html>
