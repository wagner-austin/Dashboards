<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024, viewport-fit=cover, user-scalable=no">
    <title>Bunny Scroller</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            min-height: 100vh;
            overflow: hidden;
        }

        /* The scene draws into three stacked elements, not one, so the actor
           can carry its own colour without the renderer tracking a colour per
           character cell. Every one of them is the full viewport grid and they
           share these metrics exactly, so they align with no positioning
           arithmetic. Spaces are transparent, so DOM stacking order reproduces
           the old single-buffer draw order: world, actor, foreground.

           Colours come from the `colors` block in config.json and are applied
           at startup by applyLayerColors. The values here are only what shows
           before the config lands. */
        #screen, #screen-actor, #screen-foreground {
            font-family: "Courier New", monospace;
            /* Character size sets the WHOLE scene's scale — trees, rabbit and
               glyphs alike — because Viewport.ts derives the grid as
               floor(viewportHeight / charH). Raise it and everything grows;
               it is not the knob for how far up the trees reach. Use the
               iframe's height for that. */
            font-size: 10px;
            line-height: 1.0;
            white-space: pre;
            color: #e0e0e0;
            position: absolute;
            bottom: 0;
            left: 0;
        }

        /* Pointer events would otherwise be swallowed by whichever layer sits
           on top, which is not the one the touch handler listens on. */
        #screen-actor, #screen-foreground { pointer-events: none; }
    </style>
</head>
<body>
    <pre id="screen"></pre>
    <pre id="screen-actor"></pre>
    <pre id="screen-foreground"></pre>
    <!--
      The bundle filename carries a content hash, which makes the bundle itself
      safe to cache forever. But this page is served with max-age=600, so a
      hard-coded <script src> would leave a returning visitor pointing at the
      PREVIOUS hash for ten minutes after a deploy — the hash is only as fresh
      as the document naming it, and that was the bug.

      So the name is not in the document. It is read from a manifest fetched
      with a cache-busting query on every load. This markup never changes, so
      caching it is harmless.
    -->
    <script type="module">
      const manifest = await fetch(
        new URL(`bundle/manifest.json?v=${Date.now()}`, document.baseURI),
        { cache: "no-store" }
      ).then((r) => r.json());
      await import(new URL(`bundle/${manifest.entry}`, document.baseURI).href);
    </script>
</body>
</html>
